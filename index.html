<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kas Rohis - Pawelangit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-lunas { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-cicil { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .status-belum { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body class="bg-slate-50 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800">Manajemen Kas Rohis</h1>
            <p class="text-slate-500">Iuran: <span class="font-bold text-blue-600">Rp 10.000 / bulan</span></p>
            
            <div class="mt-6 flex flex-wrap gap-4">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Pilih Anggota</label>
                    <select id="selectAnggota" onchange="renderKas()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                        </select>
                </div>
                <button onclick="openModal()" class="self-end px-6 py-2.5 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-all shadow-md shadow-blue-100">
                    + Input Pembayaran
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-4 text-slate-600 font-semibold">Bulan</th>
                            <th class="p-4 text-slate-600 font-semibold text-right">Terbayar</th>
                            <th class="p-4 text-slate-600 font-semibold text-right">Sisa Tagihan</th>
                            <th class="p-4 text-slate-600 font-semibold text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="kasTableBody">
                        </tbody>
                </table>
            </div>
        </div>

        <footer class="mt-8 text-center text-slate-400 text-sm">
            &copy; 2026 Admin Rohis - Developed by Pawelangit
        </footer>
    </div>

    <div id="modalBayar" class="fixed inset-0 bg-slate-900/50 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-6 text-slate-800">Form Pembayaran</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Bulan</label>
                    <select id="inputBulan" class="w-full p-2 border rounded-lg bg-slate-50">
                        </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nominal Bayar (Rp)</label>
                    <input type="number" id="inputNominal" placeholder="Contoh: 5000" 
                           class="w-full p-2 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-8">
                <button onclick="closeModal()" class="px-5 py-2 text-slate-500 hover:bg-slate-100 rounded-lg">Batal</button>
                <button onclick="prosesBayar()" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Simpan Data</button>
            </div>
        </div>
    </div>

    <script>
        const targetPerBulan = 10000;
        const daftarNama = [
            "anditenrilengka", "muhammad sa'ad hamzah", "nurul alifiyatul aswan", "naswa", "saskia", "syahrul",
            "evi agnesia", "melinda saputri", "andi syahrul yudiono", "Almira ramadhani", "reski sulistia",
            "andi ratu bilqis", "andi muh luqman", "arkan fikri", "besse nurfadillah", "fitria", "putriani",
            "andi fadhil rumpang", "muh. resky wijaya", "muh fikran", "muh fauzan hidayatullah",
            "nurul sabila ramadhani", "nur asmil hasanah", "febri aulya kasunaya", "muh. iqbal", "yuliana",
            "Muh ilham", "Aldi supriadi", "zahrah rahmadhani"
        ];
        const bulanList = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        // Inisialisasi Database (Storage sederhana)
        let dbKas = {};
        daftarNama.forEach(nama => {
            dbKas[nama] = bulanList.map(bulan => ({ namaBulan: bulan, terbayar: 0 }));
        });

        // Setup Dropdown Nama & Bulan
        function setupApp() {
            const selectA = document.getElementById('selectAnggota');
            daftarNama.sort().forEach(nama => {
                selectA.innerHTML += `<option value="${nama}">${nama.toUpperCase()}</option>`;
            });

            const selectB = document.getElementById('inputBulan');
            bulanList.forEach((bulan, idx) => {
                selectB.innerHTML += `<option value="${idx}">${bulan}</option>`;
            });

            renderKas();
        }

        function renderKas() {
            const namaTerpilih = document.getElementById('selectAnggota').value;
            const dataBulan = dbKas[namaTerpilih];
            const tbody = document.getElementById('kasTableBody');
            tbody.innerHTML = '';

            dataBulan.forEach(item => {
                const sisa = targetPerBulan - item.terbayar;
                let status = "Belum Bayar";
                let sClass = "status-belum";

                if (item.terbayar >= targetPerBulan) {
                    status = "Lunas";
                    sClass = "status-lunas";
                } else if (item.terbayar > 0) {
                    status = "Dicicil";
                    sClass = "status-cicil";
                }

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50/50 transition-colors text-sm">
                        <td class="p-4 font-medium text-slate-700">${item.namaBulan}</td>
                        <td class="p-4 text-right text-green-600 font-semibold">Rp ${item.terbayar.toLocaleString()}</td>
                        <td class="p-4 text-right text-red-500 font-semibold">Rp ${Math.max(0, sisa).toLocaleString()}</td>
                        <td class="p-4 text-center">
                            <span class="px-3 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider ${sClass}">
                                ${status}
                            </span>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal() { document.getElementById('modalBayar').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modalBayar').classList.add('hidden'); }

        function prosesBayar() {
            const nama = document.getElementById('selectAnggota').value;
            const idxBulan = document.getElementById('inputBulan').value;
            const nominal = parseInt(document.getElementById('inputNominal').value);

            if (isNaN(nominal) || nominal <= 0) {
                alert("Masukkan nominal yang benar!");
                return;
            }

            dbKas[nama][idxBulan].terbayar += nominal;
            renderKas();
            closeModal();
            document.getElementById('inputNominal').value = '';
        }

        setupApp();
    </script>
</body>
</html>
