<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Rohis Online - SYAHRUL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-lunas { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-cicil { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .status-belum { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body class="bg-slate-50 font-sans p-4 md:p-8 text-slate-800">

    <div class="max-w-6xl mx-auto">
        <header class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold">Kas Rohis Online 🌐</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="adminBadge" class="hidden px-2 py-0.5 bg-green-600 text-white text-[10px] font-bold rounded italic uppercase tracking-wider">Mode Admin: SYAHRUL Aktif</span>
                        <p id="dbStatus" class="text-rose-500 text-xs font-medium italic">Menghubungkan...</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="loginBtn" onclick="loginAdmin()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-semibold text-sm hover:bg-slate-200 transition-all">
                        Login Admin
                    </button>
                    <button onclick="checkAdminBeforeOpen()" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-semibold shadow-md hover:bg-blue-700 transition-all">
                        + Input Bayar
                    </button>
                </div>
            </div>
            
            <div class="mt-6 pt-6 border-t border-slate-100">
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 tracking-widest">Cek Data Anggota</label>
                <select id="selectAnggota" onchange="renderKas()" class="w-full md:w-1/2 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all"></select>
            </div>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 uppercase text-[10px] tracking-widest text-slate-500">
                        <tr>
                            <th class="p-4">Bulan</th>
                            <th class="p-4 text-right">Terbayar</th>
                            <th class="p-4 text-right">Sisa Tagihan</th>
                            <th class="p-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="kasTableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

        <footer class="mt-8 text-center text-slate-400 text-[10px] uppercase tracking-[0.3em]">
            Developed by <span class="font-bold text-slate-600">SYAHRUL</span> | SMK 1 WAJO
        </footer>
    </div>

    <div id="modalBayar" class="fixed inset-0 bg-slate-900/60 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm shadow-2xl border-2 border-blue-50">
            <h2 class="text-xl font-bold mb-6 text-slate-800">Input Kas (Admin)</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-500 italic">Pilih Bulan</label>
                    <select id="inputBulan" class="w-full p-3 border rounded-xl bg-slate-50 outline-none"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-500 italic">Nominal Uang (Rp)</label>
                    <input type="number" id="inputNominal" placeholder="Contoh: 10000" class="w-full p-3 border rounded-xl bg-slate-50 font-bold text-blue-600 outline-none focus:ring-2 focus:ring-blue-400">
                </div>
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="closeModal()" class="flex-1 py-3 text-slate-400 font-semibold hover:bg-slate-50 rounded-xl transition-all">Batal</button>
                <button onclick="prosesBayar()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 transition-all">SIMPAN DATA</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqMfqjxoV7KUT8XAolVfKs3dEI0vtVxGQ",
            authDomain: "kas-rohis.firebaseapp.com",
            projectId: "kas-rohis",
            storageBucket: "kas-rohis.firebasestorage.app",
            messagingSenderId: "1055631031220",
            appId: "1:1055631031220:web:4708fb2e47f5189c9d10e1",
            measurementId: "G-287L0WH3DD",
            databaseURL: "https://kas-rohis-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const kasRef = ref(db, 'pembayaran_kas');

        let isAdmin = false;
        window.dbKas = {};

        const daftarNama = [
            "anditenrilengka", "muhammad sa'ad hamzah", "nurul alifiyatul aswan", "naswa", "saskia", "syahrul",
            "evi agnesia", "melinda saputri", "andi syahrul yudiono", "Almira ramadhani", "reski sulistia",
            "andi ratu bilqis", "andi muh luqman", "arkan fikri", "besse nurfadillah", "fitria", "putriani",
            "andi fadhil rumpang", "muh. resky wijaya", "muh fikran", "muh fauzan hidayatullah",
            "nurul sabila ramadhani", "nur asmil hasanah", "febri aulya kasunaya", "muh. iqbal", "yuliana",
            "Muh ilham", "Aldi supriadi", "zahrah rahmadhani"
        ].sort();
        const bulanList = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        // Setup Dropdown
        const selectA = document.getElementById('selectAnggota');
        daftarNama.forEach(nama => selectA.innerHTML += `<option value="${nama}">${nama.toUpperCase()}</option>`);
        const selectB = document.getElementById('inputBulan');
        bulanList.forEach((bulan, idx) => selectB.innerHTML += `<option value="${idx}">${bulan}</option>`);

        // Load Realtime Data
        onValue(kasRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.dbKas = data;
                document.getElementById('dbStatus').innerText = "Cloud Online ✅";
                document.getElementById('dbStatus').className = "text-green-500 text-xs font-medium italic";
            } else {
                // Struktur awal jika database kosong
                let init = {};
                daftarNama.forEach(n => init[n] = bulanList.map(b => ({ namaBulan: b, terbayar: 0 })));
                set(kasRef, init);
            }
            renderKas();
        });

        // Logika Admin
        window.loginAdmin = function() {
            const pw = prompt("Masukkan Password Admin (Syahrul):");
            if (pw === "KAS ROHIS") {
                isAdmin = true;
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('loginBtn').innerText = "SYAHRUL (ADMIN)";
                document.getElementById('loginBtn').className = "px-4 py-2 bg-green-100 text-green-700 rounded-xl font-bold text-sm";
                alert("Berhasil Login! Selamat bekerja, Syahrul.");
            } else {
                alert("Password Salah!");
            }
        };

        window.checkAdminBeforeOpen = function() {
            if (!isAdmin) {
                alert("Maaf, tombol ini hanya bisa digunakan oleh Admin (SYAHRUL). Silakan login dulu!");
                return;
            }
            document.getElementById('modalBayar').classList.remove('hidden');
        };

        window.renderKas = function() {
            const nama = document.getElementById('selectAnggota').value;
            const data = window.dbKas[nama] || [];
            const tbody = document.getElementById('kasTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const sisa = 10000 - item.terbayar;
                let status = "BELUM BAYAR", sClass = "status-belum";
                if (item.terbayar >= 10000) { status = "LUNAS", sClass = "status-lunas"; }
                else if (item.terbayar > 0) { status = "DICICIL", sClass = "status-cicil"; }

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/50 transition-all">
                        <td class="p-4 font-bold text-slate-700">${item.namaBulan}</td>
                        <td class="p-4 text-right text-emerald-600 font-black">Rp ${item.terbayar.toLocaleString()}</td>
                        <td class="p-4 text-right text-rose-500 font-black">Rp ${Math.max(0, sisa).toLocaleString()}</td>
                        <td class="p-4 text-center">
                            <span class="px-3 py-1 rounded-lg text-[10px] font-black border ${sClass}">${status}</span>
                        </td>
                    </tr>`;
            });
        };

        window.prosesBayar = function() {
            if (!isAdmin) {
                alert("Error: Sesi Admin tidak ditemukan!");
                return;
            }

            const nama = document.getElementById('selectAnggota').value;
            const idx = document.getElementById('inputBulan').value;
            const nominal = parseInt(document.getElementById('inputNominal').value);

            if (!nominal || nominal <= 0) {
                alert("Nominal tidak valid!");
                return;
            }

            // Update variabel lokal
            window.dbKas[nama][idx].terbayar += nominal;
            
            // Simpan ke Firebase
            set(kasRef, window.dbKas)
                .then(() => {
                    alert("Berhasil! Data kas " + nama + " telah diperbarui.");
                    closeModal();
                    document.getElementById('inputNominal').value = '';
                })
                .catch(e => alert("Gagal Simpan: " + e.message));
        };

        window.closeModal = () => document.getElementById('modalBayar').classList.add('hidden');
    </script>
</body>
</html>
